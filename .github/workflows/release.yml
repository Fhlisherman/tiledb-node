name: Release
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: linux-x64
            pkg: packages/linux-x64
          - host: macos-latest
            target: darwin-arm64
            pkg: packages/darwin-arm64
          - host: macos-13
            target: darwin-x64
            pkg: packages/darwin-x64
          - host: windows-latest
            target: win32-x64
            pkg: packages/win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - name: Build binary
        run: |
          cd ${{ matrix.settings.pkg }}
          pnpm run build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.settings.target }}
          path: ${{ matrix.settings.pkg }}/build/Release/tiledb_bindings.node

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      
      - name: Build Core
        run: pnpm --filter tiledb-node run build

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Distribute binaries
        run: |
          mkdir -p packages/linux-x64/build/Release/
          cp artifacts/bin-linux-x64/tiledb_bindings.node packages/linux-x64/build/Release/
          
          mkdir -p packages/darwin-arm64/build/Release/
          cp artifacts/bin-darwin-arm64/tiledb_bindings.node packages/darwin-arm64/build/Release/
          
          mkdir -p packages/darwin-x64/build/Release/
          cp artifacts/bin-darwin-x64/tiledb_bindings.node packages/darwin-x64/build/Release/
          
          mkdir -p packages/win32-x64/build/Release/
          cp artifacts/bin-win32-x64/tiledb_bindings.node packages/win32-x64/build/Release/

      - name: Setup NPM Auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
